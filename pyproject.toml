[project]
name = "gamota-research-mcp"
version = "0.1.0"
description = "Evidence-traceable research core for Gamota game-market research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gamota_research"]

[tool.hatch.build.force-include]
"src/gamota_research/fixtures/store_fixture.json" = "gamota_research/fixtures/store_fixture.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
