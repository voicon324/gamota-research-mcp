# Include inside the existing HTTPS server block. Keep the existing /mcp block
# unchanged; these exact locations must precede the SPA fallback.
location = /mcp-public {
    proxy_pass http://127.0.0.1:8002/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8002;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
}

location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:8000/.well-known/oauth-protected-resource/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location = /.well-known/oauth-authorization-server {
    proxy_pass http://127.0.0.1:8001/.well-known/oauth-authorization-server;
    proxy_http_version 1.1;
